name: Pipeline CI/CD

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]   # x86_64 y arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: webapp:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.runner }}        # lee cache de runs anteriores
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }} # guarda cache para el próximo run

      - name: Detect secrets (Gitleaks)
        if: matrix.runner == 'ubuntu-latest'   # basta con escanear una vez
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-dev:
    name: Deploy → dev
    needs: build-and-test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy a S3 (dev)
        run: aws s3 sync ./ s3://${{ secrets.S3_BUCKET }} --delete --exclude ".git/*"

  deploy-staging:
    name: Deploy → staging
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy a S3 (staging)
        run: aws s3 sync ./ s3://${{ secrets.S3_BUCKET }} --delete --exclude ".git/*"

  deploy-production:
    name: Deploy → production
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production       # ← requiere aprobación manual
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy a S3 (production)
        run: aws s3 sync ./ s3://${{ secrets.S3_BUCKET }} --delete --exclude ".git/*"
